name: Verificar links de afiliado

on:
  schedule:
    - cron: "0 11 * * *"   # todo dia 08:00 em Brasilia (11:00 UTC)
  workflow_dispatch:        # botao pra rodar na mao quando quiser

# O --fix escreve na tabela e commita as paginas regeradas de volta no repo.
permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # 1. Os LINKS da tabela ainda atribuem comissao?
      #    --fix so DESATIVA o que quebrou; nunca adota valor novo sozinho.
      - name: Checar links de afiliado
        id: links
        continue-on-error: true
        run: python3 check_links.py --fix

      # 2. As PAGINAS GERADAS ainda batem com a tabela?
      #    Elas sao HTML estatico: nao passam pela tabela em runtime, entao um
      #    valor corrigido no banco NAO chega nelas ate alguem regerar.
      #    --fix = regerar da tabela (nunca editar o HTML na mao).
      - name: Checar paginas geradas
        id: pages
        continue-on-error: true
        run: python3 check_pages.py --fix

      - name: Commitar o que o autofix mudou
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A firms.json logs seo compare guides */seo */compare */guides sitemap.xml 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "nada mudou"
          else
            git commit -m "chore(autofix): paginas regeradas da tabela firms [skip ci]"
            git push
          fi

      # 3. Falhou alguma coisa? O job fica vermelho e o GitHub manda e-mail sozinho.
      #    Isso vem DEPOIS do commit de proposito: o conserto e' salvo mesmo quando
      #    sobra problema que so humano resolve.
      - name: Resultado
        if: steps.links.outcome == 'failure' || steps.pages.outcome == 'failure'
        run: |
          echo "links:   ${{ steps.links.outcome }}"
          echo "paginas: ${{ steps.pages.outcome }}"
          echo "Ver logs/autofix.log no repo pra saber o que foi desativado."
          exit 1

